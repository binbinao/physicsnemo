# Hydra training entry-point configuration for the nucleosome-positioning
# operator.  Every key is overridable on the command line, e.g.:
#   python train.py steps=200 device=cpu

# --- run -------------------------------------------------------------------
seed: 95051
steps: 16000
batch_size: 64
lr: 1.0e-3
lr_step_size: 6000
lr_gamma: 0.3
loss: rel_l2
device: cuda
log_every: 250
val_every: 1000

# --- corpus ----------------------------------------------------------------
n_train: 12000
n_val: 512
n_test: 600
seq_length: 1024
gc_low: 0.30
gc_high: 0.70
planted_fraction: 0.25
gamma_low: 0.5
gamma_high: 2.0
val_seed_offset: 1
test_seed: 20260920

# --- sequence -> energy landscape model -----------------------------------
table_seed: 20260920
energy_scale: 0.22
width: 147

# --- operator --------------------------------------------------------------
latent_channels: 96
num_fno_layers: 6
num_fno_modes: 128
padding: 16
